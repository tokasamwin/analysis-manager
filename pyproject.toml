[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "analysis-manager"
version = "0.1.0"
description = "Tools for running staged analyses, design-space searches, and optimisations."
requires-python = ">=3.9"
dependencies = [
    "appdirs",
    "numpy",
    "pandas",
    "pymoo",
    "scipy",
]
authors = [
	{name = "Sam Ha"}
]
readme = "README.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["analysisManager*"]
